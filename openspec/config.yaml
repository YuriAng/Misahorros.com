schema: spec-driven

context: |
  Tech stack: Vite 5.4 (build), vanilla ES modules (src/), Express 4.22 + Knex + PostgreSQL (server/).
  Frontend: main.js (entry), render.js (DOM), state.js (in-memory state + mutations), api.js (HTTP client), storage.js (localStorage bridge).
  Backend: Express server (index.js), database layer (db.js), route handlers (routes/), services (services/), migrations.
  Testing: Vitest 4.1 with unit tests (tests/unit/) and contract tests vs ephemeral Postgres (tests/contract/), file-parallel execution (correctness over speed).
  Coverage: no coverage tool configured. Linting/formatting/type-checking: not configured.
  Architecture: single-project monorepo; one npm root; database persistence via Knex; localStorage fallback in frontend.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Flag any change touching storage.js or database schema as a persistence-boundary change
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (plain ES modules, no framework)
      - Maintain database schema compatibility via Knex migrations
      - Preserve contract test coverage for API surface and data integrity
    # Compliance record (task 7.5, change `multiple-budgets`): strict_tdd
    # and apply.tdd were honored end-to-end across all 7 phases — every
    # migration assertion, profile-CRUD invariant, cross-profile isolation
    # guarantee, and parity check was written as a RED test referencing
    # production code that did not exist or did not yet cover the new
    # behavior, run to confirm failure, then made GREEN with the minimum
    # implementation. See tasks.md for the full per-task RED/GREEN trail.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Warn before merging changes that alter the database schema

strict_tdd: true

projects:
  - relative_path: "."
    stack: "Vite + Vanilla JS (frontend), Express + Knex + Postgres (backend), Vitest"
    test_command: "npm test"
    test_layers:
      unit: true
      integration: true
      e2e: false
