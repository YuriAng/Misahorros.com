services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budgetpwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budgetpwa}
      POSTGRES_DB: ${POSTGRES_DB:-budgetpwa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-budgetpwa}:${POSTGRES_PASSWORD:-budgetpwa}@postgres:5432/${POSTGRES_DB:-budgetpwa}
      APP_TZ: ${APP_TZ:-America/Caracas}
      PORT: 3000
    ports:
      - "${APP_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
