<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4F8EF7" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
  <title>Mi Presupuesto</title>
  <!-- Fase 4 agregará aquí: <link rel="manifest" href="/manifest.json"> y los <link rel="apple-touch-icon"> -->
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>💰 Mi Presupuesto</h1>
      <div class="profile-nav">
        <select id="profileSelect" aria-label="Presupuesto activo"></select>
        <button id="manageProfilesBtn" class="btn-icon-sm" aria-label="Gestionar presupuestos">⚙</button>
      </div>
      <div class="month-nav">
        <button id="prevMonth" class="btn-icon-sm" aria-label="Mes anterior">‹</button>
        <span id="monthLabel">—</span>
        <button id="nextMonth" class="btn-icon-sm" aria-label="Mes siguiente">›</button>
      </div>
    </header>

    <main>
      <section class="summary-card" id="summaryCard"></section>

      <section class="categories-section">
        <div class="section-header">
          <h2>Categorías</h2>
          <button id="addCategoryBtn" class="btn-link">+ Nueva</button>
        </div>
        <div id="categoriesList" class="categories-list"></div>
      </section>

      <section class="transactions-section">
        <h2>Gastos recientes</h2>
        <div id="transactionsList" class="transactions-list"></div>
      </section>
    </main>

    <button id="fabAddExpense" class="fab" aria-label="Agregar gasto">+</button>

    <!-- Formulario: nuevo gasto -->
    <div id="expenseFormOverlay" class="overlay" hidden>
      <form id="expenseForm" class="sheet">
        <h2 id="expenseFormTitle">Nuevo gasto</h2>
        <input type="hidden" id="expenseId">
        <label>Monto
          <input type="number" id="expenseAmount" step="0.01" min="0.01" required inputmode="decimal" placeholder="0.00">
        </label>
        <label>Categoría
          <select id="expenseCategory" required></select>
        </label>
        <label>Fecha
          <input type="date" id="expenseDate" required>
        </label>
        <label>Nota (opcional)
          <input type="text" id="expenseNote" maxlength="80" placeholder="Ej. Supermercado">
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn-secondary" data-close>Cancelar</button>
          <button type="submit" class="btn-primary">Guardar gasto</button>
        </div>
      </form>
    </div>

    <!-- Formulario: categoría (crear/editar) -->
    <div id="categoryFormOverlay" class="overlay" hidden>
      <form id="categoryForm" class="sheet">
        <h2 id="categoryFormTitle">Nueva categoría</h2>
        <input type="hidden" id="categoryId">
        <label>Nombre
          <input type="text" id="categoryName" maxlength="30" required placeholder="Ej. Mascotas">
        </label>
        <label>Ícono (emoji)
          <input type="text" id="categoryIcon" maxlength="4" placeholder="🐾">
        </label>
        <label>Color
          <div id="colorSwatches" class="color-swatches">
            <button type="button" class="color-swatch" data-color="#4F8EF7" style="background:#4F8EF7" aria-label="Azul"></button>
            <button type="button" class="color-swatch" data-color="#22C55E" style="background:#22C55E" aria-label="Verde"></button>
            <button type="button" class="color-swatch" data-color="#EF4444" style="background:#EF4444" aria-label="Rojo"></button>
            <button type="button" class="color-swatch" data-color="#F59E0B" style="background:#F59E0B" aria-label="Naranja"></button>
            <button type="button" class="color-swatch" data-color="#A855F7" style="background:#A855F7" aria-label="Morado"></button>
            <button type="button" class="color-swatch" data-color="#EC4899" style="background:#EC4899" aria-label="Rosa"></button>
            <button type="button" class="color-swatch" data-color="#14B8A6" style="background:#14B8A6" aria-label="Turquesa"></button>
            <button type="button" class="color-swatch" data-color="#64748B" style="background:#64748B" aria-label="Gris"></button>
            <input type="color" id="categoryColor" value="#4F8EF7">
          </div>
        </label>
        <label>Presupuesto mensual
          <input type="number" id="categoryBudget" step="0.01" min="0" required inputmode="decimal" placeholder="0.00">
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn-danger" id="deleteCategoryBtn" hidden>Eliminar</button>
          <button type="button" class="btn-secondary" data-close>Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>

    <!-- Formulario: presupuesto/perfil (crear/editar) -->
    <div id="profileFormOverlay" class="overlay" hidden>
      <form id="profileForm" class="sheet">
        <div class="section-header">
          <h2 id="profileFormTitle">Presupuesto activo</h2>
          <button type="button" class="btn-link" id="newProfileBtn">+ Nuevo</button>
        </div>
        <input type="hidden" id="profileId">
        <label>Nombre
          <input type="text" id="profileName" maxlength="30" required placeholder="Ej. Negocio">
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn-danger" id="deleteProfileBtn" hidden>Archivar</button>
          <button type="button" class="btn-secondary" data-close>Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>

    <!-- Formulario: ingreso mensual -->
    <div id="incomeFormOverlay" class="overlay" hidden>
      <form id="incomeForm" class="sheet">
        <h2>Ingreso mensual</h2>
        <label>Monto disponible este mes
          <input type="number" id="incomeAmount" step="0.01" min="0" required inputmode="decimal" placeholder="0.00">
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn-secondary" data-close>Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
